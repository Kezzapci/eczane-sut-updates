name: Windows sürümünü yayınla

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Sürüm bilgisini hazırla
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows yükleyicisini oluştur
        run: npm run package:win

      - name: Windows Release’i ve tüm asset’leri yayımla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path release -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' } | ForEach-Object { $_.FullName }
          if (-not $assets) { throw 'release klasöründe Windows asset’i bulunamadı.' }
          gh release create "v$env:APP_VERSION" $assets --repo "$env:GITHUB_REPOSITORY" --title "Eczane SUT Kontrol $env:APP_VERSION" --notes "Windows masaüstü sürümü otomatik oluşturuldu."
