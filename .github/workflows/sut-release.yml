name: SUT verisini otomatik yayınla

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      force_republish:
        description: 'Mevcut resmi paketi EK-4A barkod indeksiyle yeniden zenginleştir'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  publish-sut:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Veri araçlarını kur
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: SGK kaynağını tara ve paketi doğrula
        id: fetch
        env:
          SUT_OUTPUT_DIR: /tmp/sut-fetch
        run: |
          set -euo pipefail
          mkdir -p "$SUT_OUTPUT_DIR"
          node scripts/fetch-sut.mjs | tee /tmp/sut-fetch.log
          if grep -q '^changed=true' /tmp/sut-fetch.log || [[ "${{ inputs.force_republish || 'false' }}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: EK-4A barkod ve ilaç indeksini üret
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/sut-unpacked
          mkdir -p /tmp/sut-unpacked
          unzip -q /tmp/sut-fetch/sut-package.zip -d /tmp/sut-unpacked || true
          test "$(find /tmp/sut-unpacked -type f | wc -l)" -gt 0
          ek4a=$(find /tmp/sut-unpacked -type f \( -iname '*EK-4A*.xlsx' -o -iname '*EK-4A*.xls' \) ! -iname '*MULGA*' ! -iname '*MÜLGA*' | head -n 1)
          test -n "$ek4a"
          python scripts/build-medicine-index.py "$ek4a" /tmp/sut-fetch/medicine-index.json
          python scripts/enrich-sut-package.py \
            --package /tmp/sut-fetch/sut-package.zip \
            --index /tmp/sut-fetch/medicine-index.json \
            --result /tmp/sut-fetch/result.json

      - name: Release asset adını ve manifesti hazırla
        if: steps.fetch.outputs.changed == 'true'
        env:
          SUT_RESULT: /tmp/sut-fetch/result.json
          MANIFEST_OUTPUT: /tmp/sut-fetch/manifest.json
          UPDATES_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/write-manifest.mjs
          echo "data_version=$(jq -r .dataVersion /tmp/sut-fetch/result.json)" >> "$GITHUB_ENV"
          echo "release_tag=$(jq -r .packageUrl /tmp/sut-fetch/manifest.json | sed -E 's#.*/releases/download/([^/]+)/.*#\1#')" >> "$GITHUB_ENV"
          echo "asset_name=sut-$(jq -r .dataVersion /tmp/sut-fetch/result.json).zip" >> "$GITHUB_ENV"

      - name: SUT veri Release’ini oluştur
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp /tmp/sut-fetch/sut-package-enriched.zip "/tmp/sut-fetch/${asset_name}"
          gh release create "$release_tag" "/tmp/sut-fetch/${asset_name}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SUT veri ${data_version}" \
            --notes "Resmi SGK kaynağı SHA-256 ile doğrulandı; EK-4A barkod ve ilaç arama indeksi pakete dahil edildi."

      - name: latest manifesti yayımla
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sut/latest.json
          git commit -m "data: publish SUT ${data_version}"
          git push origin main
